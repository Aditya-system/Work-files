<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        style{
            display: flex;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            margin-right: 30px;
        }
    </style>
</head>

<body>
    <div id="div"></div>
    <script>
        let a = ['Afghanistan','Albania','Algeria','Andorra','Angola','AntiguaBarbuda','Argentina'];
        let b = document.getElementById("div");
        let text = ""


        a.forEach(element => {
            text += element.setAttribute('class','style');
        });

        document.getElementById("div").innerHTML = text ; 
    </script>
</body>

</html>
